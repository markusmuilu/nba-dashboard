# Rebuilds the static dashboard every day and publishes it to GitHub Pages.
#
# One-time setup (see README): repository Settings > Pages > Source = "GitHub Actions",
# and four repository secrets for read access to the R2 bucket:
#   R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
name: Build and deploy dashboard

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC, after the prediction service's 12:00 Helsinki run
    - cron: "30 21 * * *"   # evening refresh: picks up the day's Finnish results
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-build.txt
      - name: Build site/data.json from R2 and the Finland tab from the federation's results service
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
